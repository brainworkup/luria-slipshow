&lt;style&gt;body {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  right: 0;
}

#slipshow-main {
  position: relative;
  flex-grow: 1;
}

#slipshow-open-window {
  position: absolute;
  overflow: hidden;
  background-color: white;
}

.slipshow-format-container {
  transform-origin: top left;
}
.slip, .slide {
  width: calc(var(--page-width) - 2px);
  transform-origin: top left;
  /* Borders make margin of inner elements not leak outside */
  border: 1px solid transparent;
}

.slide {
  height: calc(var(--page-height) - 2px);
  width: calc(var(--page-width) - 2px);
}

.slipshow-rescaler {
  /* overflow-x: hidden; */
  /* overflow-y: hidden; */
  /* /\* Whether or not to hide what's outside of rescalers is not clear. I decided to */
  /*  hide to avoid having the shadow of the title leak outside. *\/ */
  /* Hiding it to fix a shadow is very bad! I decided to not hide it to be able to
     include drawings where they are included. */
  overflow: visible;
  width: unset;
  height: unset;
  min-width: 0;
}
html,
body {
  margin: 0;
  padding: 0;
  background-color: black;
}

#slipshow-universe {
  /* position: absolute; */
  /* top: 0; */
  /* left: 0; */
  contain: paint layout;
}

.slipshow-scale-container {
    /* contain: paint layout; */
    will-change: transform
}
.pauseAncestor ~ *, .pauseTarget {
  opacity: 0;
  pointer-events: none;
}

.unstatic {
  position: absolute;
  visibility: hidden;
}

.unrevealed {
  opacity: 0;
  pointer-events: none;
}

#slipshow-counter:hover {
  text-decoration: underline;
}

#slipshow-counter {
  position: absolute;
  bottom: 0;
  right: 0;
  background-color: white;
  padding: 5px;
  font-size: 2em;
  border: 1px solid black;
  border-radius: 5px;
  cursor: pointer;
}

.slipshow__carousel {
    display: grid;
}
.slipshow__carousel &gt; .slipshow__carousel_children {
    grid-area: 1 / 1;

}
.slipshow__carousel &gt; .slipshow__carousel_children:not(.slipshow__carousel_active) {
  visibility: hidden;
}
.slipshow__carousel:not(.carousel-fixed-size) &gt; .slipshow__carousel_children:not(.slipshow__carousel_active) {
  position: absolute;
}

.slipshow__carousel &gt; .slipshow__carousel_children.slipshow__carousel_active ~ .slipshow__carousel_children {
  visibility: hidden;
}
.slipshow__carousel:not(.carousel-fixed-size) &gt; .slipshow__carousel_children.slipshow__carousel_active ~ .slipshow__carousel_children {
  position: absolute;
}
[slipshow-pdf] {
  display:inline-block;
}

[slipshow-pdf] canvas {
  display: block;
  width: 100%;
}

.__slipshow__speaker_note {
    display: none;
}
&lt;/style&gt;
&lt;style&gt;.slipshow-drawing-mode #slipshow-open-window &gt; *,
.slipshow-editing-mode #slipshow-open-window &gt; *{
  pointer-events: none;
}

#slipshow-drawing-toolbar {
  position: absolute;
  top: 0;
  left: 0;
}

#slipshow-drawing-toolbar:hover,
.slipshow-editing-mode #slipshow-drawing-toolbar {
  max-width: 50%;
  max-height: 100vh;
}

.slipshow-drawing-mode #slipshow-drawing-toolbar,
.slipshow-guiing-mode #slipshow-drawing-toolbar
{
  max-height: 100vh;
}
#slipshow-drawing-toolbar:hover {
  transition:
    max-width 0.3s,
    max-height 0.3s;
}
#slipshow-drawing-toolbar {
  transition:
    max-width 0.3s 0.5s,
    max-height 0.3s 0.5s;
  overflow: hidden;
  max-width: 32px;
  max-height: 32px;
  border-radius: 0px 0px 16px 16px;
  background-color: white;
  border-right: 1px solid black;
  border-bottom: 1px solid black;
}
.slip-writing-toolbar {
  display: flex;
  flex-direction: column;
  max-width: 100vw;
  max-height: 100vh;
  flex-wrap: wrap;
  z-index: 10;
  user-select: none;
}

.slip-writing-toolbar &gt; .tool-block {
  display: flex;
  flex-direction: column;
  margin-bottom: 10px;
  gap:2px;
  padding-right: 10px;
}
.slip-writing-toolbar &gt; .tool-block:not(:last-child) {
  border-bottom: 1px solid black;
  padding-bottom: 10px;
  padding-right: 10px;
}
.slip-writing-toolbar .slipshow-icon {
  width: 30px;
  height: 30px;
  border: 1px solid black;
  border-radius: 30px;
  transition: border-radius 0.5s;
  display:flex;
  align-items: center;
  justify-content: center;
}
.slip-writing-toolbar .slipshow-manage-recording-block .slipshow-icon {
  border: 1px solid transparent;
}
.slipshow-manage-recording {
  padding-left: 10px;;
  padding-right: 10px;
  padding-bottom: 10px;
}
.slipshow-button {
  cursor: pointer;
  white-space: nowrap;
}

.slip-writing-toolbar &gt; .slip-toolbar-color &gt; .slip-toolbar-red {
  background-color: red;
}
.slip-writing-toolbar &gt; .slip-toolbar-color &gt; .slip-toolbar-black {
  background-color: black;
}
.slip-writing-toolbar &gt; .slip-toolbar-color &gt; .slip-toolbar-blue {
  background-color: blue;
}
.slip-writing-toolbar &gt; .slip-toolbar-color &gt; .slip-toolbar-green {
  background-color: green;
}
.slip-writing-toolbar &gt; .slip-toolbar-color &gt; .slip-toolbar-yellow {
  background-color: yellow;
}
.slip-writing-toolbar .slipshow-button {
  display: flex;
  justify-content: left;
  align-items: center;
  gap: 5px;
  font-size: 25px;
}
.slip-writing-toolbar &gt; .slip-toolbar-width .slipshow-icon &gt; * {
  width: 14px;
  border-radius: 16px;
}

.slip-writing-toolbar &gt; .slip-toolbar-width .slip-toolbar-small.slipshow-icon &gt; * {
  border: 1px solid black;
}
.slip-writing-toolbar &gt; .slip-toolbar-width .slip-toolbar-medium.slipshow-icon &gt; * {
  border: 2px solid black;
}
.slip-writing-toolbar &gt; .slip-toolbar-width .slip-toolbar-large.slipshow-icon &gt; * {
  border: 4px solid black;
}
.slip-writing-toolbar .slipshow-icon.slip-set-tool,
.slip-writing-toolbar .slipshow-icon.slip-set-width {
  background-color: lightsteelblue;
  border-radius: 5px;
}

.slip-writing-toolbar .slip-set-color {
  height: 28px;
  width: 28px;
  border: 2px solid steelblue;
  border-radius: 5px;
}

kbd.slipshow-key {
  border: 1px solid black;
  padding: 2px;
  border-radius: 6px;
  margin-left: 15px;
  background: rgb(225, 225, 225);
  font-size: 0.75em;
}

kbd.slipshow-key-panel {
  border: 1px solid black;
  border-radius: 6px;
  background: rgb(225, 225, 225);
  padding: 5px;
}

#slipshow-drawing-editor {
  font-size: 24px;
}

#slipshow-drawing-editor select {
  font-size: 24px;
}

#slipshow-drawing-editor input[type=&quot;text&quot;] {
  font-size: 20px;
}
#slipshow-drawing-editor {
  /* overflow: auto; */
  opacity: 0.98;
  top: 0;
  left: 0;
  bottom: 0;
  padding: 30px;
  background:#e9c46a;
  z-index: 100;
}
.slipshow-dont-display {
  display: none;
}
.slipshow-drawing-editor-display {
  stroke: darkorange;
}
.time-slider {
  width: 100%;
}
.slipshow-toc-mode #slipshow-toc {
  display: block;
}

#slipshow-toc {
  overflow: auto;
  opacity: 0.98;
  top: 0;
  left: 0;
  bottom: 0;
  min-width: 25%;
  max-width: 30%;
  padding: 30px;
  background: rosybrown;
  display: none;
  z-index: 100;
}

.slipshow-toc-step {
  display: inline-block;
  border: 1px solid black;
  border-radius: 3px;
  padding: 5px;
  padding-bottom: 0px;
  margin: 5px;
  margin-left: 0;
  margin-right: 10px;
}

.slipshow-toc-only-step {
  display: inline-block;
}

.slipshow-toc-step:hover {
    box-shadow: 2px 2px 2px black;
}

.slipshow-toc-entry {
  cursor: pointer;
}

.slipshow-toc-current-step .slipshow-toc-step {
  background-color: red;
}
#slip-touch-controls {
  display: none;
}

.mobile #slip-touch-controls {
  display: unset;
}

.mobile.slipshow-toc-mode.horizontal #slip-touch-controls,
.mobile.slipshow-toc-mode.vertical #slip-touch-controls {
  display: none;
}

.mobile.horizontal #slip-touch-controls {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  height: 10vw;
  justify-content: space-evenly;
}

.mobile.horizontal #slip-touch-controls &gt; div {
  width: 10vw;
  background: rgba(0, 0, 0, 0.3);
  cursor: pointer;
  color: white;
  font-size: 10vw;
  text-align: center;
  vertical-align: middle;
  line-height: 10vw;
}

.mobile.vertical #slip-touch-controls {
  position: fixed;
  right: 0;
  width: 10vh;
  display: flex;
  height: 80vh;
  justify-content: space-evenly;
  flex-direction: column;
}

.mobile.vertical #slip-touch-controls &gt; div {
  width: 10vh;
  background: rgba(0, 0, 0, 0.3);
  cursor: pointer;
  color: white;
  font-size: 10vh;
  text-align: center;
  vertical-align: middle;
  line-height: 10vh;
}


body.slipshow-drawing-mode,
body.slipshow-editing-mode{
  touch-action: pinch-zoom;
}

#slipshow-vertical-flex {
  display: flex;
  height: 100vh;
  flex-direction: column;
  overflow: hidden;
}
#slipshow-horizontal-flex {
  display: flex;
  flex-grow: 1;
  flex-direction: row-reverse;
  overflow: hidden;
}

#slipshow-content {
  border: 1px solid transparent;
}

/* See drawing/event.ml and drawing_editor/editor_tools.ml if you modify.

   Adds padding so that you can draw on the side of your content */
#slipshow-universe {
  padding: 2000px;
  min-width: var(--page-width);
  min-height: var(--page-height);
}

.slipshow-blink {
  animation: blink 2s step-start 0s infinite;
}
@keyframes blink {
  50% {
    opacity: 0.0;
  }
}

.slipshow-svg-container {
  display: inline-block;
}
.slipshow-svg-container svg {
  width: 100%;
  height: auto;
}

.slipshow-hand-drawn {
  position: absolute;
  z-index: 1000;
}

[gui] {
  position: absolute;
}
.slipshow-activated {
  box-shadow: 0 0 0 5px red !important;
}
.slipshow-guiing-mode [gui] {
  cursor: pointer;
}
.slipshow-guiing-mode [gui]:hover:not(:has([gui]:hover)) {
  box-shadow: 0 0 0 5px grey !important;
}
&lt;/style&gt;

  &lt;/head&gt;
  &lt;body&gt;
    &lt;div id=&quot;slipshow-vertical-flex&quot;&gt;
      &lt;div id=&quot;slipshow-horizontal-flex&quot;&gt;
        &lt;div id=&quot;slipshow-main&quot;&gt;
          &lt;div id=&quot;slipshow-content&quot;&gt;
            &lt;svg id=&quot;slipshow-drawing-elem&quot; style=&quot;overflow:visible; position: absolute; z-index:1000; pointer-events: none&quot;&gt;&lt;/svg&gt;
            &lt;div class=&quot;slipshow-rescaler&quot; slip enter-at-unpause=&quot;welcome ~duration:0&quot;&gt;
&lt;div class=&quot;slip&quot;&gt;
&lt;div class=&quot;slip-body&quot;&gt;
&lt;div src=feedback.md include&gt;
&lt;div id=&quot;welcome&quot; class=&quot;slipshow-rescaler&quot; no-enter slide&gt;
&lt;div class=&quot;slide&quot;&gt;
&lt;div class=&quot;slide-body&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;Luria / A guide to understanding scores&lt;/p&gt;
&lt;h1&gt;A score is a starting point.&lt;br&gt;Let’s find the meaning.&lt;/h1&gt;
&lt;p class=&quot;lede&quot;&gt;A short conversation about comparisons, patterns,&lt;br&gt;and what helps in everyday life.&lt;/p&gt;
&lt;img class=&quot;hero-curve&quot; src=&quot;assets/bell-curve.svg&quot; alt=&quot;Bell curve, with most scores near the middle and fewer toward each end&quot;&gt;
&lt;p class=&quot;footer&quot;&gt;5–10 minutes together · Teaching examples only · No patient data&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div id=&quot;comparison&quot; class=&quot;slipshow-rescaler&quot; enter-at-unpause=&quot;~duration:0.4&quot; slide&gt;
&lt;div class=&quot;slide&quot;&gt;
&lt;div class=&quot;slide-body&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;01 / The comparison&lt;/p&gt;
&lt;h2&gt;Compared with whom?&lt;/h2&gt;
&lt;p class=&quot;lede&quot;&gt;A test score becomes useful when we compare it with a relevant reference group.&lt;/p&gt;
&lt;div class=&quot;columns&quot;&gt;&lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;A fair starting point&lt;/h3&gt;&lt;p&gt;Often, people of a similar age. Some tests account for other background factors.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;Your context still matters&lt;/h3&gt;&lt;p&gt;Language, learning opportunities, health, sleep, and the testing situation help us interpret the result.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;takeaway&quot;&gt;Your clinician will explain which comparison group was used.&lt;/p&gt;
&lt;p class=&quot;question&quot;&gt;“What were you hoping this evaluation would help explain?”&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div id=&quot;curve&quot; class=&quot;slipshow-rescaler&quot; enter-at-unpause=&quot;~duration:0.4&quot; slide&gt;
&lt;div class=&quot;slide&quot;&gt;
&lt;div class=&quot;slide-body&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;02 / The bell curve&lt;/p&gt;
&lt;h2&gt;Many scores gather near the middle.&lt;/h2&gt;
&lt;img class=&quot;hero-curve&quot; src=&quot;assets/bell-curve.svg&quot; alt=&quot;Symmetrical bell curve with fewer scores toward either end&quot;&gt;
&lt;div class=&quot;columns&quot;&gt;&lt;div&gt;&lt;h3&gt;Height means frequency&lt;/h3&gt;&lt;p&gt;The taller middle represents more people. The lower ends represent fewer people.&lt;/p&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;A model, not a rule for every test&lt;/h3&gt;&lt;p&gt;Many standardized scores use this shape. Some test results have a different distribution.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;takeaway&quot;&gt;“Normal distribution” names a mathematical shape. It does not label a person as normal or abnormal.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div id=&quot;explore&quot; class=&quot;slipshow-rescaler&quot; enter-at-unpause=&quot;~duration:0.4&quot; slide&gt;
&lt;div class=&quot;slide&quot;&gt;
&lt;div class=&quot;slide-body&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;03 / Explore together&lt;/p&gt;
&lt;h2&gt;Where does this score sit?&lt;/h2&gt;
&lt;svg id=&quot;explorer-curve&quot; class=&quot;curve&quot; viewBox=&quot;0 0 1100 310&quot; role=&quot;img&quot; aria-label=&quot;Interactive normal distribution&quot;&gt;&lt;/svg&gt;
&lt;div class=&quot;controls&quot;&gt;&lt;label for=&quot;score-slider&quot;&gt;Move the score&lt;/label&gt;&lt;input id=&quot;score-slider&quot; type=&quot;range&quot; min=&quot;-30&quot; max=&quot;30&quot; value=&quot;0&quot;&gt;&lt;button data-z=&quot;-1&quot;&gt;One step below&lt;/button&gt;&lt;button data-z=&quot;0&quot;&gt;Middle&lt;/button&gt;&lt;button data-z=&quot;1&quot;&gt;One step above&lt;/button&gt;&lt;/div&gt;
&lt;div class=&quot;stats&quot;&gt;&lt;div class=&quot;stat&quot;&gt;Distance in SD&lt;output id=&quot;z-value&quot;&gt;0&lt;/output&gt;&lt;/div&gt;&lt;div class=&quot;stat&quot;&gt;Standard score&lt;output id=&quot;ss-value&quot;&gt;100&lt;/output&gt;&lt;/div&gt;&lt;div class=&quot;stat&quot;&gt;T score&lt;output id=&quot;t-value&quot;&gt;50&lt;/output&gt;&lt;/div&gt;&lt;div class=&quot;stat&quot;&gt;Percentile rank ≈&lt;output id=&quot;percentile-value&quot;&gt;50&lt;/output&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p id=&quot;curve-caption&quot; class=&quot;small&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;Shading shows the share at or below the score. Ideal normal model; test-manual norms take priority. Click outside controls to resume arrow-key navigation.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div id=&quot;percentile&quot; class=&quot;slipshow-rescaler&quot; enter-at-unpause=&quot;~duration:0.4&quot; slide&gt;
&lt;div class=&quot;slide&quot;&gt;
&lt;div class=&quot;slide-body&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;04 / A rank, not a grade&lt;/p&gt;
&lt;h2&gt;The 16th percentile is not 16% correct.&lt;/h2&gt;
&lt;div class=&quot;columns&quot;&gt;&lt;div&gt;&lt;p class=&quot;big&quot;&gt;16 of 100&lt;/p&gt;&lt;p&gt;Roughly 16 out of 100 people in the reference group scored at or below this level.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;Different questions&lt;/h3&gt;&lt;p&gt;&lt;strong&gt;Percent correct:&lt;/strong&gt; How many items did I answer correctly?&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Percentile rank:&lt;/strong&gt; Where does my performance sit in the comparison group?&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;takeaway&quot;&gt;Percentiles are not equal steps: moving from 50 to 60 is a different score distance than moving from 90 to 100.&lt;/p&gt;
&lt;details&gt;&lt;summary&gt;Quick check: Does the 50th percentile mean half the answers were wrong?&lt;/summary&gt;&lt;p&gt;No. It means the score is near the middle of the reference group.&lt;/p&gt;&lt;/details&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div id=&quot;rulers&quot; class=&quot;slipshow-rescaler&quot; enter-at-unpause=&quot;~duration:0.4&quot; slide&gt;
&lt;div class=&quot;slide&quot;&gt;
&lt;div class=&quot;slide-body&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;05 / Different rulers, same location&lt;/p&gt;
&lt;h2&gt;Standard deviation is a unit of spread.&lt;/h2&gt;
&lt;p&gt;One standard deviation (SD) is one step away from the mean, or center.&lt;/p&gt;
&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Common score ruler&lt;/th&gt;&lt;th&gt;One SD below&lt;/th&gt;&lt;th&gt;Middle&lt;/th&gt;&lt;th&gt;One SD above&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Standard score · SD 15&lt;/td&gt;&lt;td&gt;85&lt;/td&gt;&lt;td&gt;100&lt;/td&gt;&lt;td&gt;115&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;T score · SD 10&lt;/td&gt;&lt;td&gt;40&lt;/td&gt;&lt;td&gt;50&lt;/td&gt;&lt;td&gt;60&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Scaled score · SD 3&lt;/td&gt;&lt;td&gt;7&lt;/td&gt;&lt;td&gt;10&lt;/td&gt;&lt;td&gt;13&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Percentile · approximately&lt;/td&gt;&lt;td&gt;16th&lt;/td&gt;&lt;td&gt;50th&lt;/td&gt;&lt;td&gt;84th&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
&lt;p class=&quot;takeaway&quot;&gt;In a normal distribution, about 68% of scores fall within ±1 SD; about 95% fall within ±2 SD.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;These are common conventions, not rules for every test. A percentile is a rank, not an equal-interval score ruler.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div id=&quot;ranges&quot; class=&quot;slipshow-rescaler&quot; enter-at-unpause=&quot;~duration:0.4&quot; slide&gt;
&lt;div class=&quot;slide&quot;&gt;
&lt;div class=&quot;slide-body&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;06 / Reading the report&lt;/p&gt;
&lt;h2&gt;Range names are signposts.&lt;/h2&gt;
&lt;p&gt;A report may use these words to describe where a performance score falls.&lt;/p&gt;
&lt;div class=&quot;bands&quot;&gt;&lt;div class=&quot;band&quot;&gt;&lt;b&gt;≤1&lt;/b&gt;Exceptionally low&lt;/div&gt;&lt;div class=&quot;band&quot;&gt;&lt;b&gt;2–8&lt;/b&gt;Below average&lt;/div&gt;&lt;div class=&quot;band&quot;&gt;&lt;b&gt;9–24&lt;/b&gt;Low average&lt;/div&gt;&lt;div class=&quot;band&quot;&gt;&lt;b&gt;25–74&lt;/b&gt;Average&lt;/div&gt;&lt;div class=&quot;band&quot;&gt;&lt;b&gt;75–90&lt;/b&gt;High average&lt;/div&gt;&lt;div class=&quot;band&quot;&gt;&lt;b&gt;91–97&lt;/b&gt;Above average&lt;/div&gt;&lt;div class=&quot;band&quot;&gt;&lt;b&gt;≥98&lt;/b&gt;Exceptionally high&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;small&quot;&gt;Whole-number percentile bands for performance tests. Labels and cutoffs can differ across tests and reports.&lt;/p&gt;
&lt;p class=&quot;takeaway&quot;&gt;A boundary is not a cliff. Scores are estimates; measurement uncertainty matters near a cutoff.&lt;/p&gt;
&lt;p&gt;“Average” describes a comparison. It does not tell us everything about someone’s needs or strengths.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div id=&quot;meaning&quot; class=&quot;slipshow-rescaler&quot; enter-at-unpause=&quot;~duration:0.4&quot; slide&gt;
&lt;div class=&quot;slide&quot;&gt;
&lt;div class=&quot;slide-body&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;07 / From numbers to meaning&lt;/p&gt;
&lt;h2&gt;Uncommon does not automatically&lt;br&gt;mean impaired.&lt;/h2&gt;
&lt;div class=&quot;columns&quot;&gt;&lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;Statistical rarity&lt;/h3&gt;&lt;p&gt;How unusual is this score in the reference group?&lt;/p&gt;&lt;p&gt;One low result can occur in healthy people, especially when many scores are collected.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;Functional difficulty&lt;/h3&gt;&lt;p&gt;What is hard in school, work, home life, or relationships?&lt;/p&gt;&lt;p&gt;We connect the pattern with history, observations, validity, and everyday experience.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;takeaway&quot;&gt;A low score alone does not establish a diagnosis. An average score alone does not rule out meaningful difficulty.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;On some symptom rating scales, a higher score means more concerns. Check the direction and meaning of each scale.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div id=&quot;domains&quot; class=&quot;slipshow-rescaler&quot; enter-at-unpause=&quot;~duration:0.4&quot; slide&gt;
&lt;div class=&quot;slide&quot;&gt;
&lt;div class=&quot;slide-body&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;08 / From the whole picture to the details&lt;/p&gt;
&lt;h2&gt;Look for a pattern across skills.&lt;/h2&gt;
&lt;p class=&quot;small&quot;&gt;Synthetic teaching profile · Select a domain · Bars show percentile ranks, not amount of ability&lt;/p&gt;
&lt;div class=&quot;domain-nav&quot;&gt;&lt;button data-domain=&quot;attention&quot; aria-pressed=&quot;true&quot;&gt;Attention&lt;/button&gt;&lt;button data-domain=&quot;memory&quot; aria-pressed=&quot;false&quot;&gt;Learning &amp; memory&lt;/button&gt;&lt;button data-domain=&quot;reasoning&quot; aria-pressed=&quot;false&quot;&gt;Reasoning&lt;/button&gt;&lt;/div&gt;
&lt;div id=&quot;domain-detail&quot; class=&quot;domain-detail&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
&lt;p class=&quot;takeaway&quot;&gt;Broad domain → related skills → individual measures → everyday context.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;Fictional labels and values; no commercial test items or diagnostic conclusions. Apparent differences need clinical interpretation.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;div id=&quot;handoff&quot; class=&quot;slipshow-rescaler&quot; enter-at-unpause=&quot;~duration:0.4&quot; slide&gt;
&lt;div class=&quot;slide&quot;&gt;
&lt;div class=&quot;slide-body&quot;&gt;
&lt;p class=&quot;eyebrow&quot;&gt;09 / Your feedback conversation&lt;/p&gt;
&lt;h2&gt;Now, let’s connect the dots.&lt;/h2&gt;
&lt;div class=&quot;columns&quot;&gt;&lt;div&gt;&lt;h3&gt;In Luria, we’ll ask…&lt;/h3&gt;&lt;p&gt;What seems easier?&lt;/p&gt;&lt;p&gt;What takes more effort?&lt;/p&gt;&lt;p&gt;Which supports fit daily life?&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;panel&quot;&gt;&lt;h3&gt;Your perspective belongs here.&lt;/h3&gt;&lt;p&gt;“Does this pattern match what you notice?”&lt;/p&gt;&lt;p&gt;“What would make the biggest difference this week?”&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
&lt;p class=&quot;takeaway&quot;&gt;Clinician handoff: switch to the appropriate case in Luria and open the domain score view.&lt;/p&gt;
&lt;p class=&quot;small&quot;&gt;This teaching deck has no patient connection. Confirm the correct case and screen-sharing privacy before showing a real report.&lt;/p&gt;
&lt;p class=&quot;footer&quot;&gt;A score helps us ask better questions. The goal is useful understanding and support.&lt;/p&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;

  'use strict';
  // Standard normal CDF approximation (maximum absolute error about 7.5e-8).
  function cdf(z) {const t=1/(1+.2316419*Math.abs(z));const d=.3989422804014327*Math.exp(-z*z/2);const p=1-d*t*(.319381530+t*(-.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));return z&gt;=0?p:1-p;}
  const x=z=&gt;70+(z+3)*160, y=z=&gt;260-220*Math.exp(-z*z/2);
  function path(a,b){let s=`M ${x(a)} 260`;for(let z=a;z&lt;b;z+=.025)s+=` L ${x(z)} ${y(z)}`;return s+` L ${x(b)} ${y(b)} L ${x(b)} 260 Z`;}
  function init(){
    const svg=document.querySelector('#explorer-curve'), slider=document.querySelector('#score-slider');
    if(!svg||!slider)return;
    function render(){const z=Number(slider.value)/10,p=cdf(z)*100;
      svg.innerHTML=`&lt;title&gt;Normal curve with ${p.toFixed(1)} percent of its area to the left of the selected score&lt;/title&gt;&lt;path d=&quot;${path(-3,3)}&quot; fill=&quot;#dce9ed&quot;/&gt;&lt;path d=&quot;${path(-3,z)}&quot; fill=&quot;#72b1cc&quot;/&gt;&lt;path d=&quot;${path(-3,3)}&quot; fill=&quot;none&quot; stroke=&quot;#24566c&quot; stroke-width=&quot;2&quot;/&gt;&lt;line x1=&quot;${x(z)}&quot; x2=&quot;${x(z)}&quot; y1=&quot;24&quot; y2=&quot;264&quot; stroke=&quot;#a6592b&quot; stroke-width=&quot;4&quot;/&gt;${[-3,-2,-1,0,1,2,3].map(v=&gt;`&lt;text x=&quot;${x(v)}&quot; y=&quot;293&quot; text-anchor=&quot;middle&quot;&gt;${v&gt;0?'+':''}${v} SD&lt;/text&gt;`).join('')}`;
      document.querySelector('#z-value').textContent=z.toFixed(1);
      document.querySelector('#ss-value').textContent=(100+15*z).toFixed(1).replace('.0','');
      document.querySelector('#t-value').textContent=(50+10*z).toFixed(1).replace('.0','');
      document.querySelector('#percentile-value').textContent=p.toFixed(1);
      document.querySelector('#curve-caption').textContent=`About ${Math.round(p)} out of 100 people in the reference group would score at or below this point in this idealized model.`;
      slider.setAttribute('aria-valuetext',`${z.toFixed(1)} standard deviations, percentile ${p.toFixed(1)}`);
    }
    slider.addEventListener('input',render);
    document.querySelectorAll('[data-z]').forEach(b=&gt;b.addEventListener('click',()=&gt;{slider.value=Number(b.dataset.z)*10;render();}));

    document.querySelectorAll('button,input,summary').forEach(el=&gt;['keydown','keyup','keypress'].forEach(type=&gt;el.addEventListener(type,e=&gt;e.stopPropagation())));
    document.addEventListener('pointerdown',e=&gt;{if(!e.target.closest('button,input,summary') &amp;&amp; document.activeElement instanceof HTMLElement)document.activeElement.blur();},true);
    const domains={
      attention:{name:'Attention &amp; working memory',items:[['Hold information',37],['Work with information',16]],prompt:'Does keeping several steps in mind feel harder than following one step at a time?'},
      memory:{name:'Learning &amp; memory',items:[['Learn across repetitions',50],['Recall after a delay',25],['Recognize information',63]],prompt:'Does repetition or a cue make remembering easier? We would check the actual test pattern before drawing that conclusion.'},
      reasoning:{name:'Reasoning',items:[['Visual problem solving',75],['Verbal reasoning',63]],prompt:'Could explaining an idea aloud or showing a visual example support learning?'}
    };
    function domain(key){const d=domains[key];document.querySelectorAll('[data-domain]').forEach(b=&gt;b.setAttribute('aria-pressed',String(b.dataset.domain===key)));document.querySelector('#domain-detail').innerHTML=`&lt;h3&gt;${d.name}&lt;/h3&gt;${d.items.map(([name,p])=&gt;`&lt;div class=&quot;row&quot;&gt;&lt;span&gt;${name}&lt;/span&gt;&lt;div class=&quot;track&quot;&gt;&lt;div class=&quot;fill&quot; style=&quot;width:${p}%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span&gt;${p}th percentile&lt;/span&gt;&lt;/div&gt;`).join('')}&lt;p class=&quot;small&quot;&gt;${d.prompt}&lt;/p&gt;`;}
    document.querySelectorAll('[data-domain]').forEach(b=&gt;b.addEventListener('click',()=&gt;domain(b.dataset.domain)));
    render();domain('attention');
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
